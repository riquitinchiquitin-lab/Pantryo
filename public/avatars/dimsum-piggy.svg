<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shPig" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgPig)" stroke="#DB2777" stroke-width="4"/>
  <!-- Piggy Ears -->
  <g filter="url(#shPig)">
    <polygon points="60,65 40,40 75,45" fill="#F472B6"/>
    <polygon points="140,65 160,40 125,45" fill="#F472B6"/>
    <!-- Head & Body -->
    <circle cx="100" cy="110" r="48" fill="#FBCFE8"/>
  </g>
  <!-- Eyes -->
  <circle cx="80" cy="102" r="5.5" fill="#0F172A"/>
  <circle cx="120" cy="102" r="5.5" fill="#0F172A"/>
  <circle cx="78" cy="100" r="2" fill="#FFFFFF"/>
  <circle cx="118" cy="100" r="2" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="68" cy="116" r="8" fill="#F43F5E" opacity="0.5"/>
  <circle cx="132" cy="116" r="8" fill="#F43F5E" opacity="0.5"/>
  <!-- Snout -->
  <g filter="url(#shPig)">
    <ellipse cx="100" cy="118" rx="16" ry="11" fill="#F472B6" stroke="#EC4899" stroke-width="2"/>
    <circle cx="94" cy="118" r="3" fill="#9D174D"/>
    <circle cx="106" cy="118" r="3" fill="#9D174D"/>
  </g>
  <!-- Bamboo Steamer with Dumpling -->
  <g filter="url(#shPig)">
    <rect x="65" y="148" width="70" height="32" rx="6" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- Dumpling peeking out -->
    <path d="M88 148 C88 135 112 135 112 148 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="100" cy="138" r="2" fill="#EA580C"/>
  </g>
</svg>
