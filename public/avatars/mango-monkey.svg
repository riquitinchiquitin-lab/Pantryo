<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMonkey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shMonkey" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgMonkey)" stroke="#C2410C" stroke-width="4"/>
  <!-- Monkey Ears -->
  <g filter="url(#shMonkey)">
    <circle cx="52" cy="95" r="20" fill="#92400E"/>
    <circle cx="52" cy="95" r="12" fill="#FED7AA"/>
    <circle cx="148" cy="95" r="20" fill="#92400E"/>
    <circle cx="148" cy="95" r="12" fill="#FED7AA"/>
    <!-- Head & Body -->
    <circle cx="100" cy="105" r="44" fill="#92400E"/>
    <!-- Heart-shaped Face Mask -->
    <path d="M70 100 C70 85 85 80 100 92 C115 80 130 85 130 100 C130 120 100 135 100 135 C100 135 70 120 70 100 Z" fill="#FED7AA"/>
  </g>
  <!-- Eyes -->
  <circle cx="88" cy="102" r="5" fill="#0F172A"/>
  <circle cx="112" cy="102" r="5" fill="#0F172A"/>
  <circle cx="86" cy="100" r="1.8" fill="#FFFFFF"/>
  <circle cx="110" cy="100" r="1.8" fill="#FFFFFF"/>
  <!-- Nose & Smile -->
  <circle cx="96" cy="112" r="2" fill="#78350F"/>
  <circle cx="104" cy="112" r="2" fill="#78350F"/>
  <path d="M92 118 Q100 125 108 118" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Ripe Mango in Hands -->
  <g filter="url(#shMonkey)">
    <ellipse cx="100" cy="158" rx="24" ry="18" fill="#F59E0B" stroke="#D97706" stroke-width="2" transform="rotate(-15 100 158)"/>
    <path d="M88 144 C84 136 92 134 96 142 Z" fill="#16A34A"/>
  </g>
</svg>
