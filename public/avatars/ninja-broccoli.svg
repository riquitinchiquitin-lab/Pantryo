<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBroc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="brocFlesh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadowBroc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgBroc)" stroke="#059669" stroke-width="4"/>

  <!-- Broccoli Stem -->
  <g filter="url(#shadowBroc)">
    <path d="M82 135 L80 180 C80 185 120 185 120 180 L118 135 Z" fill="#86EFAC" stroke="#16A34A" stroke-width="2"/>
    <line x1="94" y1="145" x2="92" y2="175" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="145" x2="108" y2="175" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Broccoli Florets (Fluffy crown) -->
  <g filter="url(#shadowBroc)">
    <circle cx="65" cy="80" r="28" fill="url(#brocFlesh)"/>
    <circle cx="135" cy="80" r="28" fill="url(#brocFlesh)"/>
    <circle cx="75" cy="50" r="26" fill="url(#brocFlesh)"/>
    <circle cx="125" cy="50" r="26" fill="url(#brocFlesh)"/>
    <circle cx="100" cy="40" r="28" fill="url(#brocFlesh)"/>
    <circle cx="100" cy="85" r="38" fill="url(#brocFlesh)"/>

    <!-- Light green florets highlights -->
    <circle cx="62" cy="74" r="10" fill="#22C55E" opacity="0.5"/>
    <circle cx="138" cy="74" r="10" fill="#22C55E" opacity="0.5"/>
    <circle cx="98" cy="36" r="12" fill="#22C55E" opacity="0.5"/>
  </g>

  <!-- Red Hero Headband -->
  <g filter="url(#shadowBroc)">
    <rect x="52" y="78" width="96" height="16" rx="4" fill="#E11D48"/>
    <!-- Headband trailing ribbons -->
    <path d="M146 84 C158 80 166 75 174 70 C166 84 162 90 170 102 C158 94 150 90 146 88 Z" fill="#BE123C"/>
    <!-- Kitchen Star Crest on Headband -->
    <circle cx="100" cy="86" r="5" fill="#FBBF24"/>
  </g>

  <!-- Big Brave Cartoon Eyes -->
  <ellipse cx="80" cy="110" rx="7" ry="9" fill="#FFFFFF"/>
  <ellipse cx="120" cy="110" rx="7" ry="9" fill="#FFFFFF"/>
  <circle cx="80" cy="111" r="5" fill="#0F172A"/>
  <circle cx="120" cy="111" r="5" fill="#0F172A"/>
  <circle cx="78" cy="108" r="2" fill="#FFFFFF"/>
  <circle cx="118" cy="108" r="2" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <circle cx="68" cy="122" r="6" fill="#F43F5E" opacity="0.45"/>
  <circle cx="132" cy="122" r="6" fill="#F43F5E" opacity="0.45"/>

  <!-- Determined / Cheerful Smile -->
  <path d="M92 124 Q100 132 108 124" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
