<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKitty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shKitty" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4C1D95" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgKitty)" stroke="#7C3AED" stroke-width="4"/>
  <!-- Kitty Ears -->
  <g filter="url(#shKitty)">
    <polygon points="55,75 40,35 80,50" fill="#DDD6FE"/>
    <polygon points="56,68 46,44 74,52" fill="#F472B6"/>
    <polygon points="145,75 160,35 120,50" fill="#DDD6FE"/>
    <polygon points="144,68 154,44 126,52" fill="#F472B6"/>
    <!-- Kitty Head -->
    <circle cx="100" cy="110" r="45" fill="#F5F3FF"/>
  </g>
  <!-- Swirly Cupcake Hat on Head -->
  <g filter="url(#shKitty)">
    <!-- Cupcake wrapper as hat base -->
    <polygon points="85,75 115,75 112,62 88,62" fill="#EC4899"/>
    <!-- Swirl of Frosting -->
    <ellipse cx="100" cy="56" rx="22" ry="10" fill="#FBCFE8"/>
    <ellipse cx="100" cy="48" rx="16" ry="8" fill="#F472B6"/>
    <ellipse cx="100" cy="42" rx="10" ry="6" fill="#FDA4AF"/>
    <!-- Cherry on top -->
    <circle cx="100" cy="35" r="5" fill="#DC2626"/>
  </g>
  <!-- Eyes -->
  <circle cx="82" cy="108" r="5.5" fill="#4338CA"/>
  <circle cx="118" cy="108" r="5.5" fill="#4338CA"/>
  <circle cx="80" cy="105" r="2" fill="#FFFFFF"/>
  <circle cx="116" cy="105" r="2" fill="#FFFFFF"/>
  <!-- Whiskers & Nose -->
  <polygon points="100,118 96,114 104,114" fill="#F472B6"/>
  <path d="M96 122 Q100 126 104 122" stroke="#4C1D95" stroke-width="1.8" fill="none"/>
  <line x1="65" y1="112" x2="76" y2="115" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="65" y1="118" x2="76" y2="118" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="135" y1="112" x2="124" y2="115" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="135" y1="118" x2="124" y2="118" stroke="#8B5CF6" stroke-width="1.5"/>
</svg>
