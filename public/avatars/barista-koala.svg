<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKoala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shKoala" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3730A3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgKoala)" stroke="#4F46E5" stroke-width="4"/>
  <!-- Large Fluffy Koala Ears -->
  <g filter="url(#shKoala)">
    <circle cx="50" cy="75" r="26" fill="#94A3B8"/>
    <circle cx="50" cy="75" r="16" fill="#F1F5F9"/>
    <circle cx="150" cy="75" r="26" fill="#94A3B8"/>
    <circle cx="150" cy="75" r="16" fill="#F1F5F9"/>
    <!-- Head & Body -->
    <path d="M52 185 C52 125 60 75 100 75 C140 75 148 125 148 185 Z" fill="#64748B"/>
    <ellipse cx="100" cy="115" rx="44" ry="38" fill="#94A3B8"/>
  </g>
  <!-- Iconic Koala Big Black Nose -->
  <ellipse cx="100" cy="115" rx="14" ry="20" fill="#1E293B"/>
  <ellipse cx="97" cy="107" rx="4" ry="6" fill="#475569" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="75" cy="102" r="5" fill="#0F172A"/>
  <circle cx="125" cy="102" r="5" fill="#0F172A"/>
  <circle cx="73" cy="100" r="1.8" fill="#FFFFFF"/>
  <circle cx="123" cy="100" r="1.8" fill="#FFFFFF"/>
  <!-- Coffee Cup in Hands -->
  <g filter="url(#shKoala)">
    <rect x="82" y="150" width="36" height="28" rx="6" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <path d="M118 156 C124 156 126 168 118 170" stroke="#B45309" stroke-width="3" fill="none"/>
    <!-- Latte Art Heart on Top -->
    <ellipse cx="100" cy="150" rx="16" ry="5" fill="#FDE68A"/>
    <path d="M97 149 C97 146 100 146 100 148 C100 146 103 146 103 149 L100 152 Z" fill="#78350F"/>
  </g>
</svg>
