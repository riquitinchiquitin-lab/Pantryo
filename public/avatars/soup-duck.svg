<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDuck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shDuck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#854D0E" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgDuck)" stroke="#CA8A04" stroke-width="4"/>
  <!-- Duck Head & Body -->
  <g filter="url(#shDuck)">
    <path d="M50 185 C50 125 65 72 100 72 C135 72 150 125 150 185 Z" fill="#FACC15"/>
    <circle cx="100" cy="100" r="38" fill="#FDE047"/>
  </g>
  <!-- Chef Toque Hat on Duck -->
  <g filter="url(#shDuck)">
    <rect x="82" y="58" width="36" height="12" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M80 58 C72 45 80 32 94 36 C100 28 112 28 118 36 C130 32 138 45 130 58 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <!-- Eyes -->
  <circle cx="84" cy="96" r="4.5" fill="#0F172A"/>
  <circle cx="116" cy="96" r="4.5" fill="#0F172A"/>
  <circle cx="82" cy="94" r="1.6" fill="#FFFFFF"/>
  <circle cx="114" cy="94" r="1.6" fill="#FFFFFF"/>
  <!-- Orange Beak -->
  <path d="M84 108 C84 102 116 102 116 108 C116 118 84 118 84 108 Z" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <!-- Soup Pot in front -->
  <g filter="url(#shDuck)">
    <rect x="70" y="148" width="60" height="36" rx="6" fill="#475569" stroke="#334155" stroke-width="2"/>
    <rect x="64" y="156" width="6" height="12" rx="2" fill="#334155"/>
    <rect x="130" y="156" width="6" height="12" rx="2" fill="#334155"/>
    <!-- Ladle -->
    <line x1="115" y1="136" x2="100" y2="160" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="100" cy="160" rx="6" ry="4" fill="#94A3B8"/>
  </g>
</svg>
