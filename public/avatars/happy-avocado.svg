<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAvo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="avoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="avoFlesh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="avoPit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <filter id="shadowAvo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgAvo)" stroke="#0D9488" stroke-width="4"/>

  <!-- Avocado Body (Outer skin) -->
  <g filter="url(#shadowAvo)">
    <path d="M100 35 C70 35 60 70 54 110 C48 150 64 182 100 182 C136 182 152 150 146 110 C140 70 130 35 100 35 Z" fill="url(#avoSkin)"/>
    <!-- Flesh -->
    <path d="M100 42 C76 42 67 72 62 108 C57 144 70 174 100 174 C130 174 143 144 138 108 C133 72 124 42 100 42 Z" fill="url(#avoFlesh)"/>
  </g>

  <!-- Pit / Belly -->
  <circle cx="100" cy="138" r="28" fill="url(#avoPit)" stroke="#451A03" stroke-width="2"/>
  <ellipse cx="94" cy="126" rx="9" ry="5" fill="#D97706" opacity="0.4"/>
  <!-- Pit shine -->
  <ellipse cx="90" cy="124" rx="4" ry="2.5" fill="#FEF3C7" opacity="0.8"/>

  <!-- Chef Glasses (cute round spectacles) -->
  <g stroke="#0F172A" stroke-width="3" fill="none">
    <circle cx="80" cy="85" r="14" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="120" cy="85" r="14" fill="#FFFFFF" fill-opacity="0.25"/>
    <line x1="94" y1="85" x2="106" y2="85"/>
    <line x1="66" y1="85" x2="60" y2="83"/>
    <line x1="134" y1="85" x2="140" y2="83"/>
  </g>

  <!-- Big Sparkling Eyes inside glasses -->
  <circle cx="80" cy="85" r="6" fill="#0F172A"/>
  <circle cx="120" cy="85" r="6" fill="#0F172A"/>
  <circle cx="78" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="118" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="82" cy="87" r="1" fill="#FFFFFF"/>
  <circle cx="122" cy="87" r="1" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="66" cy="98" rx="8" ry="5" fill="#F43F5E" opacity="0.55"/>
  <ellipse cx="134" cy="98" rx="8" ry="5" fill="#F43F5E" opacity="0.55"/>

  <!-- Big Joyful Smile with tongue -->
  <path d="M88 98 Q100 114 112 98 Z" fill="#991B1B" stroke="#0F172A" stroke-width="2"/>
  <path d="M93 105 Q100 113 107 105 Z" fill="#F43F5E"/>

  <!-- Tiny Chef Hat perched crookedly on top -->
  <g filter="url(#shadowAvo)">
    <ellipse cx="90" cy="24" rx="10" ry="9" fill="#FFFFFF"/>
    <ellipse cx="110" cy="24" rx="10" ry="9" fill="#FFFFFF"/>
    <ellipse cx="100" cy="18" rx="12" ry="11" fill="#FFFFFF"/>
    <rect x="88" y="27" width="24" height="10" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="89" y="33" width="22" height="2" fill="#0D9488"/>
  </g>
</svg>
