<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgElephant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shElephant" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#075985" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgElephant)" stroke="#0369A1" stroke-width="4"/>
  <!-- Big Elephant Ears -->
  <g filter="url(#shElephant)">
    <ellipse cx="44" cy="90" rx="26" ry="34" fill="#94A3B8"/>
    <ellipse cx="46" cy="90" rx="16" ry="22" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="156" cy="90" rx="26" ry="34" fill="#94A3B8"/>
    <ellipse cx="154" cy="90" rx="16" ry="22" fill="#F472B6" opacity="0.6"/>
    <!-- Head & Body -->
    <circle cx="100" cy="100" r="44" fill="#CBD5E1"/>
  </g>
  <!-- Eyes -->
  <circle cx="82" cy="92" r="5" fill="#0F172A"/>
  <circle cx="118" cy="92" r="5" fill="#0F172A"/>
  <circle cx="80" cy="90" r="1.8" fill="#FFFFFF"/>
  <circle cx="116" cy="90" r="1.8" fill="#FFFFFF"/>
  <!-- Trunk curled holding Strawberry Donut -->
  <g filter="url(#shElephant)">
    <path d="M94 110 C94 135 106 142 100 162" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Frosted Donut -->
    <circle cx="100" cy="148" r="24" fill="#D97706" stroke="#B45309" stroke-width="2"/>
    <!-- Pink Frosting -->
    <circle cx="100" cy="148" r="20" fill="#F472B6"/>
    <!-- Donut Hole -->
    <circle cx="100" cy="148" r="8" fill="#E0F2FE"/>
    <!-- Rainbow Sprinkles -->
    <rect x="92" y="136" width="4" height="2" rx="1" fill="#FEF08A" transform="rotate(30 92 136)"/>
    <rect x="108" y="138" width="4" height="2" rx="1" fill="#38BDF8" transform="rotate(-20 108 138)"/>
    <rect x="90" y="156" width="4" height="2" rx="1" fill="#4ADE80" transform="rotate(45 90 156)"/>
    <rect x="106" y="158" width="4" height="2" rx="1" fill="#F8FAFC" transform="rotate(10 106 158)"/>
  </g>
</svg>
