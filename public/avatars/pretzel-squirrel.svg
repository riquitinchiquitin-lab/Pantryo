<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSquirrel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shSquirrel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgSquirrel)" stroke="#B45309" stroke-width="4"/>
  <!-- Fluffy Squirrel Tail curled up on side -->
  <g filter="url(#shSquirrel)">
    <path d="M135 150 C165 140 170 70 135 60 C120 55 125 80 130 90 Z" fill="#B45309"/>
    <!-- Ears -->
    <polygon points="72,60 62,30 85,45" fill="#D97706"/>
    <polygon points="128,60 138,30 115,45" fill="#D97706"/>
    <!-- Head & Cheeks -->
    <circle cx="100" cy="95" r="38" fill="#EA580C"/>
    <!-- Chubby White Cheeks -->
    <ellipse cx="84" cy="105" rx="16" ry="12" fill="#FEF3C7"/>
    <ellipse cx="116" cy="105" rx="16" ry="12" fill="#FEF3C7"/>
  </g>
  <!-- Eyes -->
  <circle cx="86" cy="92" r="5.5" fill="#0F172A"/>
  <circle cx="114" cy="92" r="5.5" fill="#0F172A"/>
  <circle cx="84" cy="90" r="2" fill="#FFFFFF"/>
  <circle cx="112" cy="90" r="2" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="4.5" ry="3" fill="#0F172A"/>
  <!-- Golden German Pretzel Held -->
  <g filter="url(#shSquirrel)">
    <path d="M82 145 C75 135 90 120 100 132 C110 120 125 135 118 145 C112 155 105 158 100 152 C95 158 88 155 82 145 Z" fill="#92400E" stroke="#78350F" stroke-width="4" stroke-linejoin="round"/>
    <!-- Salt grains on pretzel -->
    <circle cx="85" cy="138" r="1.5" fill="#FFFFFF"/>
    <circle cx="100" cy="135" r="1.5" fill="#FFFFFF"/>
    <circle cx="115" cy="138" r="1.5" fill="#FFFFFF"/>
    <circle cx="100" cy="150" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
