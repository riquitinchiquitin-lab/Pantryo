<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHamster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="hamsterFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowHamster" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9A3412" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgHamster)" stroke="#EA580C" stroke-width="4"/>

  <!-- Hamster Ears -->
  <g filter="url(#shadowHamster)">
    <circle cx="56" cy="68" r="18" fill="#FB923C"/>
    <circle cx="56" cy="68" r="11" fill="#F472B6"/>
    <circle cx="144" cy="68" r="18" fill="#FB923C"/>
    <circle cx="144" cy="68" r="11" fill="#F472B6"/>

    <!-- Plump Chubby Hamster Body -->
    <path d="M45 185 C45 125 54 82 100 82 C146 82 155 125 155 185 Z" fill="url(#hamsterFur)"/>
    <!-- Big Chubby Cheeks -->
    <ellipse cx="68" cy="132" rx="26" ry="24" fill="#FFEDD5"/>
    <ellipse cx="132" cy="132" rx="26" ry="24" fill="#FFEDD5"/>
    <ellipse cx="100" cy="136" rx="22" ry="20" fill="#FFF7ED"/>
  </g>

  <!-- Big Sparkling Anime Hamster Eyes -->
  <ellipse cx="78" cy="112" rx="8" ry="11" fill="#18181B"/>
  <ellipse cx="122" cy="112" rx="8" ry="11" fill="#18181B"/>
  <circle cx="75.5" cy="108" r="3.5" fill="#FFFFFF"/>
  <circle cx="119.5" cy="108" r="3.5" fill="#FFFFFF"/>
  <circle cx="81" cy="115" r="1.5" fill="#FFFFFF"/>
  <circle cx="125" cy="115" r="1.5" fill="#FFFFFF"/>

  <!-- Pink Hamster Cheeks Glow -->
  <circle cx="64" cy="132" r="9" fill="#FB7185" opacity="0.6"/>
  <circle cx="136" cy="132" r="9" fill="#FB7185" opacity="0.6"/>

  <!-- Tiny Pink Hamster Nose & Smile -->
  <ellipse cx="100" cy="126" rx="5" ry="3.5" fill="#F43F5E"/>
  <path d="M96 130 Q100 134 104 130" stroke="#9A3412" stroke-width="2" fill="none"/>
  <!-- Front tooth -->
  <rect x="98" y="132" width="4" height="4" rx="0.8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Little Baker Hat -->
  <g filter="url(#shadowHamster)">
    <ellipse cx="86" cy="52" rx="14" ry="12" fill="#FFFFFF"/>
    <ellipse cx="114" cy="52" rx="14" ry="12" fill="#FFFFFF"/>
    <ellipse cx="100" cy="44" rx="18" ry="16" fill="#FFFFFF"/>
    <rect x="80" y="58" width="40" height="14" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="88" y1="62" x2="88" y2="70" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="100" y1="62" x2="100" y2="70" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="112" y1="62" x2="112" y2="70" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- Cheese Wedge held happily in tiny paws -->
  <g filter="url(#shadowHamster)">
    <polygon points="80,165 120,160 100,185" fill="url(#cheeseGrad)" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="94" cy="168" r="2.5" fill="#D97706" opacity="0.6"/>
    <circle cx="106" cy="172" r="3" fill="#D97706" opacity="0.6"/>
    <circle cx="98" cy="178" r="1.8" fill="#D97706" opacity="0.6"/>
    <!-- Tiny Paws -->
    <ellipse cx="78" cy="168" rx="6" ry="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1"/>
    <ellipse cx="122" cy="166" rx="6" ry="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1"/>
  </g>
</svg>
