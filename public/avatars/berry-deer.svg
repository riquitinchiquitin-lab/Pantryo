<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="shDeer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgDeer)" stroke="#BE185D" stroke-width="4"/>
  <!-- Antlers with Berries -->
  <path d="M75 58 Q65 40 50 42 M70 48 Q60 30 72 24" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M125 58 Q135 40 150 42 M130 48 Q140 30 128 24" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="50" cy="40" r="5" fill="#EF4444"/>
  <circle cx="72" cy="24" r="4.5" fill="#8B5CF6"/>
  <circle cx="150" cy="40" r="5" fill="#EF4444"/>
  <circle cx="128" cy="24" r="4.5" fill="#8B5CF6"/>
  <!-- Ears & Head -->
  <g filter="url(#shDeer)">
    <ellipse cx="55" cy="76" rx="16" ry="8" fill="#B45309" transform="rotate(-30 55 76)"/>
    <ellipse cx="145" cy="76" rx="16" ry="8" fill="#B45309" transform="rotate(30 145 76)"/>
    <path d="M55 185 C55 125 68 70 100 70 C132 70 145 125 145 185 Z" fill="#D97706"/>
    <ellipse cx="100" cy="112" rx="38" ry="34" fill="#F59E0B"/>
    <!-- White Muzzle -->
    <ellipse cx="100" cy="124" rx="18" ry="14" fill="#FFFBEB"/>
  </g>
  <!-- Spots on Forehead -->
  <circle cx="94" cy="88" r="2.5" fill="#FFFFFF"/>
  <circle cx="106" cy="88" r="2.5" fill="#FFFFFF"/>
  <circle cx="100" cy="82" r="2" fill="#FFFFFF"/>
  <!-- Eyes -->
  <circle cx="84" cy="104" r="5" fill="#0F172A"/>
  <circle cx="116" cy="104" r="5" fill="#0F172A"/>
  <circle cx="82" cy="102" r="1.8" fill="#FFFFFF"/>
  <circle cx="114" cy="102" r="1.8" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="4.5" ry="3" fill="#451A03"/>
  <path d="M97 124 Q100 128 103 124" stroke="#451A03" stroke-width="1.8" fill="none"/>
</svg>
