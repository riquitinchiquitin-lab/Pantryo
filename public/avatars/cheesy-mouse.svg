<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shMouse" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#713F12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgMouse)" stroke="#CA8A04" stroke-width="4"/>
  <!-- Big Round Mouse Ears -->
  <g filter="url(#shMouse)">
    <circle cx="52" cy="65" r="28" fill="#94A3B8"/>
    <circle cx="52" cy="65" r="18" fill="#F472B6"/>
    <circle cx="148" cy="65" r="28" fill="#94A3B8"/>
    <circle cx="148" cy="65" r="18" fill="#F472B6"/>
    <!-- Head & Body -->
    <path d="M55 185 C55 125 65 78 100 78 C135 78 145 125 145 185 Z" fill="#CBD5E1"/>
    <circle cx="100" cy="116" r="38" fill="#E2E8F0"/>
  </g>
  <!-- Eyes -->
  <circle cx="84" cy="110" r="5" fill="#0F172A"/>
  <circle cx="116" cy="110" r="5" fill="#0F172A"/>
  <circle cx="82" cy="108" r="1.8" fill="#FFFFFF"/>
  <circle cx="114" cy="108" r="1.8" fill="#FFFFFF"/>
  <!-- Pink Nose & Whiskers -->
  <circle cx="100" cy="122" r="4" fill="#EC4899"/>
  <line x1="65" y1="120" x2="82" y2="123" stroke="#475569" stroke-width="1.5"/>
  <line x1="65" y1="126" x2="82" y2="125" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="120" x2="118" y2="123" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="126" x2="118" y2="125" stroke="#475569" stroke-width="1.5"/>
  <!-- Swiss Cheese Wedge -->
  <g filter="url(#shMouse)">
    <polygon points="75,150 125,142 115,178 68,172" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <!-- Cheese Holes -->
    <circle cx="90" cy="158" r="5" fill="#D97706" opacity="0.5"/>
    <circle cx="108" cy="155" r="4" fill="#D97706" opacity="0.5"/>
    <circle cx="98" cy="170" r="3.5" fill="#D97706" opacity="0.5"/>
  </g>
</svg>
