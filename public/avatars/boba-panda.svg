<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPanda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <filter id="shadowPanda" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgPanda)" stroke="#EC4899" stroke-width="4"/>

  <!-- Panda Ears -->
  <g filter="url(#shadowPanda)">
    <circle cx="54" cy="62" r="20" fill="#18181B"/>
    <circle cx="146" cy="62" r="20" fill="#18181B"/>

    <!-- Head & Body -->
    <path d="M48 185 C48 125 58 76 100 76 C142 76 152 125 152 185 Z" fill="#FFFFFF"/>
    <ellipse cx="100" cy="118" rx="46" ry="42" fill="#FFFFFF"/>
  </g>

  <!-- Black Eye Patches (classic cute angled panda patches) -->
  <ellipse cx="76" cy="112" rx="14" ry="17" fill="#18181B" transform="rotate(-15 76 112)"/>
  <ellipse cx="124" cy="112" rx="14" ry="17" fill="#18181B" transform="rotate(15 124 112)"/>

  <!-- Sparkling Eyes inside patches -->
  <circle cx="78" cy="110" r="6" fill="#FFFFFF"/>
  <circle cx="122" cy="110" r="6" fill="#FFFFFF"/>
  <circle cx="78" cy="110" r="4" fill="#0F172A"/>
  <circle cx="122" cy="110" r="4" fill="#0F172A"/>
  <circle cx="76.5" cy="108.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="120.5" cy="108.5" r="1.8" fill="#FFFFFF"/>

  <!-- Soft Pink Cheeks -->
  <circle cx="62" cy="130" r="8" fill="#FB7185" opacity="0.6"/>
  <circle cx="138" cy="130" r="8" fill="#FB7185" opacity="0.6"/>

  <!-- Nose & Smile -->
  <polygon points="100,126 94,122 106,122" fill="#18181B"/>
  <path d="M100 126 L100 131 M94 131 Q100 137 106 131" stroke="#18181B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cute Mint Green Kitchen Apron -->
  <g filter="url(#shadowPanda)">
    <path d="M72 165 C72 155 84 150 100 150 C116 150 128 155 128 165 L132 185 L68 185 Z" fill="#2DD4BF"/>
    <!-- Apron Pocket -->
    <rect x="88" y="166" width="24" height="15" rx="3" fill="#14B8A6"/>
    <!-- Tiny wooden spoon sticking out of pocket -->
    <rect x="99" y="157" width="2.5" height="12" rx="1" fill="#D97706"/>
    <ellipse cx="100" cy="155" rx="4" ry="5" fill="#B45309"/>
  </g>

  <!-- Panda Paws on apron -->
  <circle cx="70" cy="170" r="8" fill="#18181B"/>
  <circle cx="130" cy="170" r="8" fill="#18181B"/>
</svg>
