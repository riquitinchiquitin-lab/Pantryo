<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDragon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shDragon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7F1D1D" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgDragon)" stroke="#DC2626" stroke-width="4"/>
  <!-- Horns & Head -->
  <g filter="url(#shDragon)">
    <path d="M68 62 Q52 38 48 20 Q64 36 78 52" fill="#F59E0B"/>
    <path d="M132 62 Q148 38 152 20 Q136 36 122 52" fill="#F59E0B"/>
    <!-- Body & Head -->
    <path d="M50 185 C50 120 62 68 100 68 C138 68 150 120 150 185 Z" fill="#10B981"/>
    <ellipse cx="100" cy="108" rx="44" ry="38" fill="#34D399"/>
    <ellipse cx="100" cy="124" rx="24" ry="16" fill="#FEF08A"/>
  </g>
  <!-- Eyes -->
  <ellipse cx="80" cy="102" rx="7" ry="9" fill="#F59E0B"/>
  <ellipse cx="120" cy="102" rx="7" ry="9" fill="#F59E0B"/>
  <ellipse cx="80" cy="102" rx="3" ry="8" fill="#0F172A"/>
  <ellipse cx="120" cy="102" rx="3" ry="8" fill="#0F172A"/>
  <!-- Nostrils puffing smoke -->
  <circle cx="94" cy="122" r="2.5" fill="#047857"/>
  <circle cx="106" cy="122" r="2.5" fill="#047857"/>
  <!-- Red Chili Pepper in Hand -->
  <g filter="url(#shDragon)">
    <path d="M88 150 C80 162 95 178 115 172 C125 168 122 152 108 154 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    <path d="M88 150 Q84 142 86 138" stroke="#16A34A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Tiny flame puff -->
  <path d="M100 130 Q106 134 100 140 Q94 134 100 130 Z" fill="#F97316"/>
</svg>
