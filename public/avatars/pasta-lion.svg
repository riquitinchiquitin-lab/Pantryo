<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shLion" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#713F12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgLion)" stroke="#A16207" stroke-width="4"/>
  <!-- Spaghetti Mane! (Curled pasta noodle shapes) -->
  <g filter="url(#shLion)">
    <circle cx="100" cy="105" r="56" fill="#FBBF24" stroke="#D97706" stroke-width="3" stroke-dasharray="12 6"/>
    <!-- Lion Head -->
    <circle cx="100" cy="105" r="38" fill="#FDE047"/>
    <!-- White Muzzle -->
    <ellipse cx="100" cy="118" rx="18" ry="14" fill="#FEF9C3"/>
  </g>
  <!-- Lion Ears -->
  <circle cx="68" cy="65" r="12" fill="#D97706"/>
  <circle cx="68" cy="65" r="7" fill="#FDE047"/>
  <circle cx="132" cy="65" r="12" fill="#D97706"/>
  <circle cx="132" cy="65" r="7" fill="#FDE047"/>
  <!-- Eyes -->
  <circle cx="85" cy="98" r="5" fill="#0F172A"/>
  <circle cx="115" cy="98" r="5" fill="#0F172A"/>
  <circle cx="83" cy="96" r="1.8" fill="#FFFFFF"/>
  <circle cx="113" cy="96" r="1.8" fill="#FFFFFF"/>
  <!-- Nose & Mouth -->
  <polygon points="100,112 94,106 106,106" fill="#78350F"/>
  <path d="M100 112 L100 118 M95 118 Q100 123 105 118" stroke="#78350F" stroke-width="2" fill="none"/>
  <!-- Meatball & Fork held in front -->
  <g filter="url(#shLion)">
    <circle cx="100" cy="155" r="18" fill="#7C2D12" stroke="#451A03" stroke-width="2"/>
    <!-- Basil Leaf -->
    <path d="M100 142 C92 136 100 132 108 142 Z" fill="#16A34A"/>
  </g>
</svg>
