# GitHub Dependabot configuration
# Enforces daily security & dependency updates across npm, Docker, Python, and GitHub Actions
version: 2
updates:
  # 1. Node.js / npm production & development dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Montreal"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "auto-update"
    versioning-strategy: "increase"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # 2. Main Docker base image (Node.js / Debian security patches)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Montreal"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "docker"
      - "security"
      - "auto-update"

  # 3. Vision microservice Docker image
  - package-ecosystem: "docker"
    directory: "/vision_service"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Montreal"
    commit-message:
      prefix: "chore(docker-vision)"
    labels:
      - "docker"
      - "security"
      - "auto-update"

  # 4. Vision microservice Python packages
  - package-ecosystem: "pip"
    directory: "/vision_service"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Montreal"
    commit-message:
      prefix: "chore(pip-vision)"
    labels:
      - "python"
      - "security"
      - "auto-update"

  # 5. Model training Python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(pip)"
    labels:
      - "python"
      - "dependencies"

  # 6. GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "ci"
      - "security"
      - "auto-update"
