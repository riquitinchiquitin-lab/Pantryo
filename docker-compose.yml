services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pantryo_app
    restart: unless-stopped
    user: "1000:1000"
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    tmpfs:
      - /tmp:mode=1777,size=64M
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pantryo_admin:pantryo_secure_pass@db:5432/pantryo?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - PANTRYO_ADMIN_NAME=${PANTRYO_ADMIN_NAME:-admin}
      - PANTRYO_ADMIN_USERNAME=${PANTRYO_ADMIN_USERNAME:-admin}
      - PANTRYO_ADMIN_PASSWORD=${PANTRYO_ADMIN_PASSWORD:-}
      - KITCHEN_NAME=${KITCHEN_NAME:-Your Kitchen}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pantryo_data:/app/server/data
    networks:
      - pantryo_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pantryo_tunnel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - pantryo_net

  db:
    image: postgres:16-alpine3.21
    container_name: pantryo_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 100
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pantryo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantryo_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pantryo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Restrict database port to host loopback interface only (prevents external network vulnerability flags)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pantryo_admin} -d ${POSTGRES_DB:-pantryo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantryo_net

volumes:
  postgres_data:
    driver: local
  pantryo_data:
    driver: local

networks:
  pantryo_net:
    driver: bridge
