version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen_komrade_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://komrade_admin:komrade_secure_pass@db:5432/kitchen_komrade?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - komrade_net

  db:
    image: postgres:16-alpine
    container_name: kitchen_komrade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: komrade_admin
      POSTGRES_PASSWORD: komrade_secure_pass
      POSTGRES_DB: kitchen_komrade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komrade_admin -d kitchen_komrade"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - komrade_net

volumes:
  postgres_data:
    driver: local

networks:
  komrade_net:
    driver: bridge
